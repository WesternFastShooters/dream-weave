server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Markdown editor iframes have opaque origins because they intentionally use
  # sandbox="allow-scripts". ES modules loaded inside them therefore require
  # CORS. Only immutable build assets are exposed cross-origin.
  location /assets/ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
