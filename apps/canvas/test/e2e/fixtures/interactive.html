<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>HTML 上传链路验收</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e8f7ee; font-family: sans-serif; }
      main { padding: 24px; border: 2px solid #168a4b; border-radius: 12px; background: white; }
      h1 { color: #168a4b; }
    </style>
  </head>
  <body>
    <main>
      <h1>HTML 渲染成功</h1>
      <p id="script-status">脚本尚未执行</p>
      <button id="interaction-button" type="button">验证交互</button>
    </main>
    <script>
      document.getElementById('script-status').textContent = '脚本执行成功';
      document.body.dataset.scriptExecuted = 'true';
      document.getElementById('interaction-button').addEventListener('click', () => {
        document.getElementById('script-status').textContent = '按钮交互成功';
        document.body.dataset.interactionExecuted = 'true';
      });
    </script>
  </body>
</html>
