server {
  listen 443 ssl;
  server_name app.localhost;
  ssl_certificate /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;
  server_tokens off;

  location ^~ /internal/asset-access/ {
    proxy_pass http://dream-weave-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # The signed URL is issued for MinIO's internal authority. Keep that Host
  # header while exposing only this same-origin upload path to browsers.
  location ^~ /internal/object-upload/ {
    client_max_body_size 1g;
    proxy_pass http://minio:9000/;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ^~ /api/ {
    proxy_pass http://dream-weave-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass http://canvas:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# This origin is intentionally limited to capability-scoped preview content.
# Do not add the app SPA, API, session cookie, or object-upload routes here.
server {
  listen 443 ssl;
  server_name preview.localhost;
  ssl_certificate /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;
  server_tokens off;

  location ^~ /internal/asset-access/ {
    proxy_pass http://dream-weave-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { return 404; }
}

server {
  listen 443 ssl;
  server_name office.localhost;
  ssl_certificate /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;
  server_tokens off;

  # Resolve lazily so the real-service job can run without Office containers.
  resolver 127.0.0.11 valid=10s;
  set $office_viewer_shell http://office-viewer-shell:8080;
  location ^~ /internal/office-viewer-sessions/ {
    proxy_pass http://dream-weave-server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass $office_viewer_shell;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
