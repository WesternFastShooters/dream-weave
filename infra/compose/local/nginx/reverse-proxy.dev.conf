# Development proxy: application code runs on the host, while all stateful
# services remain Docker-managed. The preview origin deliberately exposes only
# capability-scoped asset delivery.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl;
  server_name app.localhost;
  ssl_certificate /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;
  server_tokens off;

  location ^~ /internal/asset-access/ {
    proxy_pass http://dream-weave-host:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ^~ /internal/object-upload/ {
    client_max_body_size 1g;
    proxy_pass http://minio:9000/;
    # Native server signatures use the host-published MinIO endpoint.
    proxy_set_header Host localhost:9000;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ^~ /api/ {
    proxy_pass http://dream-weave-host:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass http://dream-weave-host:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name preview.localhost;
  ssl_certificate /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;
  server_tokens off;

  location ^~ /internal/asset-access/ {
    proxy_pass http://dream-weave-host:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { return 404; }
}

server {
  listen 443 ssl;
  server_name office.localhost;
  ssl_certificate /etc/nginx/certs/local-cert.pem;
  ssl_certificate_key /etc/nginx/certs/local-key.pem;
  server_tokens off;

  resolver 127.0.0.11 valid=10s;
  set $office_viewer_shell http://office-viewer-shell:8080;
  location ^~ /internal/office-viewer-sessions/ {
    proxy_pass http://dream-weave-host:18080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / {
    proxy_pass $office_viewer_shell;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
