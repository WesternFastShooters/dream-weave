{{- $full := include "dream-weave.fullname" . -}}
{{- range $service := list (dict "name" "server" "ports" (list (dict "name" "http" "port" $.Values.service.serverHttpPort "target" "http") (dict "name" "office-source-proxy" "port" $.Values.service.officeSourceProxyPort "target" "office-source-proxy"))) (dict "name" "canvas" "ports" (list (dict "name" "http" "port" $.Values.service.canvasPort "target" "http"))) (dict "name" "office-viewer-shell" "ports" (list (dict "name" "http" "port" $.Values.service.officeViewerPort "target" "http"))) (dict "name" "onlyoffice-document-server" "ports" (list (dict "name" "http" "port" 80 "target" "http"))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-{{ $service.name }}
  labels: {{- include "dream-weave.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: {{ $service.name }}
  ports:
{{- range $port := $service.ports }}
    - name: {{ $port.name }}
      port: {{ $port.port }}
      targetPort: {{ $port.target }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-object-upload
  labels: {{- include "dream-weave.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.externalServices.minioHost | quote }}
  ports:
    - name: http
      port: {{ .Values.externalServices.minioPort }}
      targetPort: {{ .Values.externalServices.minioPort }}
